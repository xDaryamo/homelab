name: validate

on:
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # Unpinned, mise-action installs whatever https://mise.jdx.dev/VERSION returns.
          # That endpoint can point at a release whose assets are not published yet, and
          # the download 404s on every open PR at once until upstream catches up.
          version: 2026.9.2

      - name: kustomize build
        run: |
          kustomize build clusters/main
          kustomize build infrastructure/controllers
          kustomize build infrastructure/configs
          kustomize build monitoring/controllers
          kustomize build monitoring/configs
          kustomize build apps/production
          kustomize build apps/staging
