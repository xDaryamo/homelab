apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
data:
  configuration.yaml: |
    default_config:

    # http (trusted_proxies: 10.42.0.0/16 + node IPs) is imported and now
    # lives in the UI: Settings > System > Network (stored on the PVC).

    # Fake Philips Hue bridge for Alexa ("Alexa, discover devices").
    # Echo requires port 80; advertise the fixed Cilium LB IP so a pod
    # reschedule to another node doesn't break the cached bridge address.
    emulated_hue:
      listen_port: 80
      advertise_ip: 192.168.1.205
      advertise_port: 80
      exposed_domains:
        - light
