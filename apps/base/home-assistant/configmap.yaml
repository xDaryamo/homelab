apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
data:
  configuration.yaml: |
    default_config:

    # http (trusted_proxies: 10.42.0.0/16 + node IPs) is imported and now
    # lives in the UI: Settings > System > Network (stored on the PVC).

    # Custom Alexa Smart Home skill (Lambda eu-west-1 -> /api/alexa/smart_home).
    alexa:
      smart_home:
        locale: it-IT
        filter:
          include_entities:
            - light.yeelight_color_0x7c7f48f
            - light.yeelight_ceiling1_0x7c5053d
