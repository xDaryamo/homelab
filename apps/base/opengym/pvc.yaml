apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opengym-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-ssd
---
# Exercise images + GIFs, downloaded once by the init container.
# Not backed up on purpose: it is re-fetchable from upstream.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opengym-media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-ssd
