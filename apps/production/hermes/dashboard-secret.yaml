apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: hermes-dashboard
    creationPolicy: Owner
  data:
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-dashboard
        property: USERNAME
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes-dashboard
        property: PASSWORD
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes-dashboard
        property: SECRET
