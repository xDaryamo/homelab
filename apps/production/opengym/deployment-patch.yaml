apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: RP_ID
              value: gym.dariomazza.net
            - name: ORIGIN
              value: https://gym.dariomazza.net
            - name: SESSION_DAYS
              value: "90"
            - name: ALLOW_GUEST
              value: "0"
            # Registration is closed. There is no first-user exception: with this on, signup is
            # refused for everyone, and invites can only be minted by an admin, which needs
            # ADMIN_UIDS. Enabled only after the first profile existed.
            - name: INVITE_ONLY
              value: "1"
 
