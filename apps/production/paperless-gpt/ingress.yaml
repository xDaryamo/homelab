apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-gpt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    # paperless-gpt has no auth of its own
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.dariomazza.net/oauth2/start?rd=$scheme://$host$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - paperless-gpt.dariomazza.net
      secretName: paperless-gpt-tls
  rules:
    - host: paperless-gpt.dariomazza.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-gpt
                port:
                  number: 8080
