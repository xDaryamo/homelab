apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sure
resources:
  - ../../base/sure
  - namespace.yaml
  - sure-secret.yaml
  - ingress.yaml
configMapGenerator:
  - name: sure-env
    literals:
      - SELF_HOSTED=true
      - RAILS_ASSUME_SSL=true
      - RAILS_FORCE_SSL=false
      - APP_DOMAIN=finance.dariomazza.net
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=sure
      - POSTGRES_DB=sure_production
      - REDIS_URL=redis://redis:6379/1
      - OIDC_ISSUER=https://login.microsoftonline.com/ee06108a-640d-4d9d-8957-1280347fb13c/v2.0
      - OIDC_REDIRECT_URI=https://finance.dariomazza.net/auth/openid_connect/callback
      - OIDC_BUTTON_LABEL=Sign in with Microsoft
      - AUTH_LOCAL_LOGIN_ENABLED=false
      - AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED=false
      - AUTH_JIT_MODE=link_only
