apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secret
  namespace: sure
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: sure-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: sure
      property: postgres_password
  - secretKey: SECRET_KEY_BASE
    remoteRef:
      key: sure
      property: secret_key_base
