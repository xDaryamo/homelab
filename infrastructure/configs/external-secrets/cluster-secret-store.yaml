apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: "https://kv-dmazza-homelab.vault.azure.net"
      tenantId: "ee06108a-640d-4d9d-8957-1280347fb13c"
      authSecretRef:
        clientId:
          name: azure-secret-sp
          key: client-id
          namespace: external-secrets
