apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  interval: 1h0m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    provider: cloudflare
    policy: sync
    sources:
      - ingress
      - service
    domainFilters:
      - dariomazza.net
    
    txtOwnerId: "k8s-homelab"

    # v0.22 changed the default prefix to external-dns.kubernetes.io/ (no
    # fallback): keep the alpha annotations (target/cloudflare-proxied) working.
    extraArgs:
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    
    cloudflare:
      proxied: false
      
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: token
